<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typhoon ASR — ถอดเสียงภาษาไทย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root{
    --ground:#0b0e13;
    --panel:#141922;
    --panel-2:#1b2230;
    --line:#252e3d;
    --text:#e6ebf2;
    --text-2:#9aa6b8;
    --text-3:#66738a;
    --live:#f2555a;
    --ok:#3fbf9f;
    --idle:#66738a;
    --f-ui:"Anuphan","Noto Sans Thai",system-ui,-apple-system,sans-serif;
    --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--ground);
    color:var(--text);
    font-family:var(--f-ui);
    display:flex;flex-direction:column;
    overflow:hidden;
  }

  /* ---- status strip ---- */
  header{
    flex:0 0 auto;
    display:flex;align-items:center;gap:1rem;flex-wrap:wrap;
    padding:.7rem 1.1rem;
    background:var(--panel);
    border-bottom:1px solid var(--line);
  }
  .brand{
    font-family:var(--f-mono);font-size:.76rem;font-weight:500;
    letter-spacing:.12em;text-transform:uppercase;color:var(--text-2);
  }
  .brand b{color:var(--text);font-weight:500}
  .status{
    display:flex;align-items:center;gap:.45rem;
    font-family:var(--f-mono);font-size:.74rem;color:var(--text-2);
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--idle);flex:0 0 auto}
  .dot.ok{background:var(--ok);box-shadow:0 0 0 3px rgba(63,191,159,.15)}
  .dot.live{background:var(--live);box-shadow:0 0 0 3px rgba(242,85,90,.18)}
  .spacer{margin-inline-start:auto}
  .ghost{
    font-family:var(--f-ui);font-size:.82rem;color:var(--text-2);
    background:transparent;border:1px solid var(--line);
    padding:.32rem .7rem;border-radius:4px;cursor:pointer;
  }
  .ghost:hover{background:var(--panel-2);color:var(--text)}
  .ghost:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
  .ghost:disabled{opacity:.4;cursor:default}

  /* ---- transcript ---- */
  main{
    flex:1 1 auto;overflow-y:auto;
    padding:2rem 1.25rem 1rem;
  }
  .sheet{max-width:44rem;margin:0 auto;display:flex;flex-direction:column;gap:.85rem}
  .sentence{
    margin:0;font-size:1.32rem;line-height:1.85;
    color:var(--text);
    padding-inline-start:.85rem;
    border-inline-start:2px solid var(--line);
  }
  .sentence:last-of-type{border-inline-start-color:var(--ok)}
  /* ป้ายผู้พูด ใช้ขอบซ้ายของประโยคเป็นสีประจำตัว จะได้ไม่เพิ่มสิ่งรบกวนสายตา */
  .who{
    display:block;font-family:var(--f-mono);font-size:.68rem;
    letter-spacing:.06em;margin-bottom:.1rem;opacity:.85;
  }
  .spkbar{
    flex:0 0 auto;display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;
    padding:.45rem 1.1rem;background:var(--panel);border-bottom:1px solid var(--line);
  }
  .spkbar:empty{display:none}
  .spkbar .chip{display:flex;align-items:center;gap:.35rem}
  .spkbar .sw{width:9px;height:9px;border-radius:2px;flex:0 0 auto}
  .spkbar input{
    width:7.5rem;background:var(--panel-2);color:var(--text);
    border:1px solid var(--line);border-radius:4px;padding:.2rem .45rem;
    font-family:var(--f-ui);font-size:.78rem;
  }
  .spkbar input:focus{outline:none;border-color:var(--ok)}
  .spkbar .lbl{font-family:var(--f-mono);font-size:.68rem;color:var(--text-3)}
  .interim{
    margin:0;font-size:1.32rem;line-height:1.85;
    color:var(--text-3);
    padding-inline-start:.85rem;
    border-inline-start:2px dashed var(--live);
    min-height:1.85em;
  }
  .interim:empty{display:none}
  .caret{
    display:inline-block;width:2px;height:1.05em;vertical-align:-.15em;
    background:var(--live);margin-inline-start:2px;
    animation:blink 1.1s steps(2,start) infinite;
  }
  @keyframes blink{50%{opacity:0}}
  .hint{
    margin:0;color:var(--text-3);font-size:1rem;line-height:1.8;text-align:center;
    padding-top:3rem;
  }
  .hint kbd{
    font-family:var(--f-mono);font-size:.85em;background:var(--panel-2);
    border:1px solid var(--line);border-radius:3px;padding:.1em .4em;color:var(--text-2);
  }

  /* ---- control bar ---- */
  footer{
    flex:0 0 auto;
    display:flex;flex-direction:column;align-items:center;gap:.75rem;
    padding:1rem 1.25rem 1.6rem;
    background:linear-gradient(to top,var(--panel) 55%,transparent);
  }
  .meter{display:flex;align-items:flex-end;gap:3px;height:22px}
  .meter i{
    display:block;width:3px;height:3px;border-radius:1px;
    background:var(--line);transition:height .07s linear,background .07s linear;
  }
  .mic{
    width:76px;height:76px;border-radius:50%;
    border:1px solid var(--line);background:var(--panel-2);
    color:var(--text-2);
    display:grid;place-items:center;cursor:pointer;
    transition:background .16s,border-color .16s,color .16s;
  }
  .mic:hover:not(:disabled){border-color:var(--text-3);color:var(--text)}
  .mic:focus-visible{outline:2px solid var(--ok);outline-offset:3px}
  .mic:disabled{opacity:.35;cursor:default}
  .mic.on{
    background:var(--live);border-color:var(--live);color:#fff;
  }
  .mic.on::after{
    content:"";position:absolute;width:76px;height:76px;border-radius:50%;
    border:1px solid var(--live);animation:ring 1.6s ease-out infinite;
  }
  .mic-wrap{position:relative;display:grid;place-items:center}
  @keyframes ring{
    0%{transform:scale(1);opacity:.55}
    100%{transform:scale(1.5);opacity:0}
  }
  .mic-label{
    font-family:var(--f-mono);font-size:.72rem;letter-spacing:.1em;
    text-transform:uppercase;color:var(--text-3);
  }
  @media (prefers-reduced-motion:reduce){
    .mic.on::after{animation:none}
    .caret{animation:none}
  }
</style>
</head>
<body>

<header>
  <span class="brand"><b>Typhoon ASR</b> · FastConformer-Transducer</span>
  <span class="status"><span class="dot" id="dotServer"></span><span id="txtServer">กำลังเชื่อมต่อ</span></span>
  <span class="status" id="ver" title="เวอร์ชันของเซิร์ฟเวอร์ที่ต่ออยู่">–</span>
  <span class="status"><span class="dot" id="dotMic"></span><span id="txtMic">ไมค์ปิด</span></span>
  <span class="spacer"></span>
  <button class="ghost" id="btnCopy" disabled>คัดลอก</button>
  <button class="ghost" id="btnClear" disabled>ล้าง</button>
</header>

<div class="spkbar" id="spkbar">
  <span class="chip"><span class="lbl">session</span>
    <input id="sess" placeholder="ชื่อ session" style="width:6rem"></span>
</div>

<main>
  <div class="sheet">
    <p class="hint" id="hint">กดปุ่มไมโครโฟนด้านล่างเพื่อเริ่มพูด<br><span style="font-size:.85em">หรือกด <kbd>Space</kbd></span></p>
    <div id="sentences"></div>
    <p class="interim" id="interim"></p>
  </div>
</main>

<footer>
  <div class="meter" id="meter"></div>
  <div class="mic-wrap">
    <button class="mic" id="btnMic" aria-pressed="false" aria-label="เริ่มพูด">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="9" y="2" width="6" height="11" rx="3"></rect>
        <path d="M5 10.5a7 7 0 0 0 14 0"></path>
        <path d="M12 17.5V21"></path>
      </svg>
    </button>
  </div>
  <span class="mic-label" id="micLabel">เริ่มพูด</span>
</footer>

<script src="speakers.js"></script>
<script src="client.js"></script>
</body>
</html>
